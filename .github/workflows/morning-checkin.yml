name: Jamie Morning Check-in

on:
  schedule:
    # 6:03am PDT (UTC-7). Runs at 5:03am in winter (PST).
    - cron: '3 13 * * *'
  workflow_dispatch:

jobs:
  morning-checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "/jamie-morning-checkin"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
